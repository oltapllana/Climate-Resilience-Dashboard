name: Supabase Keep-Alive

on:
  schedule:
    - cron: '0 6 */4 * *'  # every 4 days at 06:00 UTC — leaves buffer against the 7-day pause window and GitHub's schedule delays
  workflow_dispatch: {}     # allows manual runs from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          status=$(curl -s -m 15 -o /dev/null -w "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/saved_stations?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")
          echo "Supabase responded with status $status"
          if [ "$status" -ge 400 ]; then
            echo "::error::Supabase ping failed with status $status"
            exit 1
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
